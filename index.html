<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь Дракона — программа поездки</title>
<meta name="theme-color" content="#FF0A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Путь Дракона">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cover" id="cover">
    <img src="assets/img/cover.jpg" alt="Путь Дракона — Турнир лидеров 2026" draggable="false">
  </header>

  <section class="status" id="status" aria-live="polite"></section>

  <nav class="tabs" id="tabs" aria-label="Дни поездки"></nav>

  <main id="day"></main>

  <footer class="foot">
    <p>Турнир лидеров 2026, группа СНГ</p>
    <p class="foot-ver" id="ver"></p>
  </footer>

  <div class="player" id="player" hidden>
    <div class="pl-row">
      <img class="pl-thumb" id="plThumb" alt="">
      <div class="pl-text">
        <div class="pl-title" id="plTitle"></div>
        <div class="pl-sub" id="plSub"></div>
      </div>
      <button class="pl-btn pl-main" id="plToggle" aria-label="Пауза">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
    </div>
    <div class="pl-seek">
      <button class="pl-btn" id="plBack" aria-label="Назад на 15 секунд">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle">15</text></svg>
      </button>
      <span id="plCur">0:00</span>
      <input type="range" id="plRange" min="0" max="1000" value="0" aria-label="Перемотка">
      <span id="plDur">0:00</span>
      <button class="pl-btn" id="plFwd" aria-label="Вперёд на 15 секунд">
        <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle">15</text></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
